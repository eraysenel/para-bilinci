<!DOCTYPE html>
<html lang="tr" data-tema="koyu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Para Bilinci — Türkiye için para yönetimi ve mentorluk</title>
<meta name="description" content="Türkiye'nin ekonomik koşullarına göre kurulmuş ücretsiz para yönetim aracı: güvenli günlük harcama, fatura önceliği, kredi kartı asgari/tam ödeme hesabı, kişisel enflasyon, kredi skoru rehberi ve yatırım takibi. Sunucu yok, hesap yok, çerez yok — veriler cihazından çıkmaz.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f2c14e'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='system-ui' font-weight='bold' fill='%231c1503'>₺</text></svg>">
<link rel="stylesheet" href="assets/css/app.css">

<meta property="og:title" content="Para Bilinci — Türkiye için para yönetimi ve mentorluk">
<meta property="og:description" content="Elindeki paranın gerçek durumu: güvenli günlük harcama, fatura önceliği, borç stratejisi, kişisel enflasyon ve yatırım takibi. Ücretsiz, reklamsız, verilerin cihazından çıkmaz.">
<meta property="og:type" content="website">
</head>
<body>

<div class="uygulama">

  <!-- Masaüstü kenar menüsü -->
  <aside class="kenar">
    <div class="marka">
      <div class="marka-im">₺</div>
      <div>
        <div class="marka-ad">Para <span>Bilinci</span></div>
        <div class="marka-alt">Türkiye edisyonu</div>
      </div>
    </div>

    <nav class="menu" id="menu" aria-label="Ana menü"></nav>

    <div class="kenar-alt">
      <button data-eylem="git" data-hedef="ayarlar">⚙ Ayarlar</button>
      <button data-eylem="git" data-hedef="gizlilik" title="Gizlilik ve KVKK">⛨ Gizlilik</button>
      <button data-eylem="tema-degis" title="Temayı değiştir">◐ Tema</button>
      <button data-eylem="kilitle" id="kilitDugme" class="gizle" title="Şimdi kilitle" style="flex:0 0 auto">⚿</button>
    </div>
  </aside>

  <!-- İçerik -->
  <main class="icerik">
    <!-- Mobil üst bar -->
    <div class="ust-bar">
      <div class="marka">
        <div class="marka-im">₺</div>
        <div class="marka-ad">Para <span>Bilinci</span></div>
      </div>
      <div class="sag-grup">
        <button data-eylem="kilitle" id="kilitDugmeMobil" class="gizle" aria-label="Şimdi kilitle">⚿</button>
        <button data-eylem="tema-degis" aria-label="Temayı değiştir">◐</button>
        <button data-eylem="git" data-hedef="ayarlar" aria-label="Ayarlar">⚙</button>
      </div>
    </div>

    <noscript>
      <div class="kart" style="margin-top:20px">
        <div class="kart-bas">JavaScript gerekli</div>
        <p class="kart-not">Para Bilinci tüm hesapları senin tarayıcında yapar ve hiçbir veriyi sunucuya göndermez.
          Bunun için JavaScript'in açık olması gerekiyor.</p>
      </div>
    </noscript>

    <div id="icerik"></div>
  </main>

</div>

<!-- Mobil alt sekmeler -->
<nav class="alt-sekme" id="altSekme" aria-label="Ana menü"></nav>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
